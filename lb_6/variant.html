<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Макет таблицы по варианту 2</title>
</head>
<body>
    <!-- Чтобы было видно сетку, задаем рамку и размеры -->
    <table border="1" width="800" height="200" style="text-align: center; border-collapse: collapse;">
        <!-- Первая строка -->
        <tr>
            <td colspan="2" rowspan="2" width="40%">Ячейка 1</td>
            <td width="20%">Ячейка 2</td>
            <td rowspan="2" width="20%">Ячейка 3</td>
            <td width="10%">Ячейка 4</td>
            <td width="10%">Ячейка 5</td>
        </tr>
        <!-- Вторая строка -->
        <tr>
            <td>Ячейка 6</td>
            <td>Ячейка 7</td>
            <td>Ячейка 8</td>
        </tr>
        <!-- Третья строка -->
        <tr>
            <td>Ячейка 9</td>
            <td colspan="2">Ячейка 10</td>
            <td>Ячейка 11</td>
            <td>Ячейка 12</td>
            <td>Ячейка 13</td>
        </tr>
    </table>
</body>
</html>
